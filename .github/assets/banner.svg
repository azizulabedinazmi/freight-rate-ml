<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#93c5fd" stroke-opacity=".18"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#93c5fd" stroke-opacity=".35"/></pattern>
    <style>.truck{animation:tr 7s linear infinite;offset-path:path('M700 250C780 140 860 220 940 120S1080 70 1140 60')}@keyframes tr{from{offset-distance:0%}to{offset-distance:100%}}
      .pred{stroke-dasharray:6 6;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-12}}</style>
  </defs>
  <rect width="1200" height="320" fill="#0c3b74"/>
  <rect width="1200" height="320" fill="url(#g)"/>
  <rect width="1200" height="320" fill="url(#G)"/>
  <rect x="16" y="16" width="1168" height="288" fill="none" stroke="#bfdbfe" stroke-width="2"/>
  <!-- route + chart -->
  <g fill="none" stroke-width="3">
    <path d="M700 250C780 140 860 220 940 120S1080 70 1140 60" stroke="#e0f2fe" stroke-dasharray="2 8" stroke-linecap="round"/>
    <polyline points="680,230 720,214 760,222 800,196 840,204 880,176 920,184 960,160 1000,150" stroke="#fbbf24"/>
    <polyline class="pred" points="1000,150 1040,140 1080,128 1120,118 1160,108" stroke="#fbbf24"/>
  </g>
  <g fill="#e0f2fe"><circle cx="700" cy="250" r="7"/><circle cx="1140" cy="60" r="7"/></g>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#bfdbfe"><text x="664" y="276">origin</text><text x="1104" y="46">dest</text><text x="1010" y="176" fill="#fbbf24">Nov–Dec forecast</text></g>
  <g class="truck"><g transform="translate(-16 -10)"><rect width="22" height="16" fill="#fbbf24"/><rect x="22" y="5" width="10" height="11" fill="#fde68a"/><circle cx="6" cy="18" r="3" fill="#e0f2fe"/><circle cx="26" cy="18" r="3" fill="#e0f2fe"/></g></g>
  <!-- title block like an engineering drawing -->
  <text x="60" y="80" font-family="Consolas, Menlo, monospace" font-size="15" fill="#93c5fd" letter-spacing="3">DWG NO. FRM-01 · REV A</text>
  <text x="56" y="150" font-family="Consolas, Menlo, monospace" font-size="62" font-weight="700" fill="#f0f9ff">freight-rate-ml</text>
  <text x="60" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#dbeafe">predict posted_rate for 12,000 loads · time-forward CV</text>
  <g transform="translate(60 222)" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e0f2fe">
    <rect width="560" height="56" fill="none" stroke="#bfdbfe"/><path d="M190 0v56M380 0v56" stroke="#bfdbfe"/>
    <text x="12" y="22" fill="#93c5fd" font-size="11">MODEL</text><text x="12" y="44">HistGBR · L1</text>
    <text x="202" y="22" fill="#93c5fd" font-size="11">TARGET</text><text x="202" y="44">log(rate)</text>
    <text x="392" y="22" fill="#93c5fd" font-size="11">DRIFT FIX</text><text x="392" y="44">14-day residual</text>
  </g>
</svg>
